{% extends "base.html" %}

{% block title %}Portfolio{% endblock %}

{% block content %}

<div id="app" data-portfolio-id="{{ portfolio_id }}">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <a href="/" class="bg-blue-500 text-white px-6 py-3 rounded-lg">Retour</a>
        <h2 class="text-2xl font-bold" id="portfolio-name">...</h2>
        <span class="text-gray-500" id="portfolio-currency">...</span>
    </div>

    <!-- Search bar -->
    <div class="relative mb-6">
        <input 
            id="stock-search"
            type="text"
            placeholder="🔍 Search a stock..."
            class="w-full border rounded-lg px-4 py-3">
        
        <!-- Dropdown résultats -->
        <div id="search-results" class="hidden absolute w-full bg-white border rounded-lg shadow-lg mt-1">
            <!-- Résultats générés par JS -->
        </div>
    </div>

    <!-- Total value + Gain -->
    <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-gray-500">Total value</p>
            <h3 class="text-2xl font-bold" id="portfolio-value">-</h3>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
            <p class="text-gray-500">Gain</p>
            <h3 class="text-2xl font-bold" id="portfolio-gain">-</h3>
        </div>
    </div>

    <!-- Holdings -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h3 class="font-bold text-xl mb-4">Holdings</h3>
        <table class="w-full">
            <thead>
                <tr class="text-left text-gray-500">
                    <th>Ticker</th>
                    <th>Company Name</th>
                    <th>Total shares</th>
                    <th>Avg price</th>
                    <th>Value</th>
                    <th>Currency</th>
                    <th>Gain</th>
                </tr>
            </thead>
            <tbody id="holdings-table">
                <!-- Fill par JS -->
            </tbody>
        </table>
    </div>

    <!-- Buy button -->
    <button class="bg-blue-500 text-white px-6 py-3 rounded-lg">+ Buy stocks</button>


    <!-- Buy modal-->
    <div id="buy-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-6 w-96">
            
            <!-- Header -->
            <h3 class="font-bold text-xl mb-4 text-center">Buy</h3>
            <p class="text-gray-500 mb-4"><span id="buy-ticker"></span> - <span id="buy-company"></span></p>
            <p class="mb-4">Current price : 
                <span class="font-bold" id="current-price"></span>
                <span id="currency"></span>
            </p>

            <!-- Inputs avec labels à gauche -->
            <div class="flex items-center mb-3">
                <label class="w-32 text-gray-500">Share quantity</label>
                <input type="number" id="buy-quantity" placeholder="100" 
                    class="flex-1 border rounded-lg px-3 py-2">
            </div>

            <div class="flex items-center mb-4">
                <label class="w-32 text-gray-500">Fee</label>
                <input type="number" id="buy-fee" placeholder="0"
                    class="flex-1 border rounded-lg px-3 py-2">
            </div>

            <p class="mb-6">Total : <span class="font-bold" id="buy-total">...</span></p>

            <!-- Boutons centrés -->
            <div class="flex justify-center gap-4">
                <button onclick="buyStock()" class="bg-blue-500 text-white px-4 py-2 rounded-lg">
                    Acheter
                </button>
                <button onclick="closeModal('buy-modal')" class="bg-red-500 text-white px-4 py-2 rounded-lg">
                    Annuler
                </button>
            </div>

        </div>
</div>




</div>
{% endblock %}


{% block scripts %}
<script src="{{ url_for('static', filename='js/portfolio.js') }}"></script>
{% endblock %}
