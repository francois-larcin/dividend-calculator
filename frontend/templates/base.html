<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dividend Calculator{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md p-4">
        <h1 class="text-xl font-bold text-gray-800">Dividend Calculator</h1>
    </nav>

    <!-- Contenu -->
    <main class="container mx-auto p-6">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Scripts JS -->
    {% block scripts %}
    {% endblock %}
    
</body>
</html>
